<!DOCTYPE html>

<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sayaç Pro - Mobile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "primary-fixed": "#e1e0ff",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#191c1e",
                        "surface-bright": "#f7f9fb",
                        "surface-container-low": "#f2f4f6",
                        "outline": "#767586",
                        "on-tertiary-container": "#fffbff",
                        "on-tertiary-fixed": "#2a1700",
                        "surface-container-highest": "#e0e3e5",
                        "on-primary-container": "#fffbff",
                        "secondary-container": "#bdbefe",
                        "surface-container-high": "#e6e8ea",
                        "on-secondary": "#ffffff",
                        "primary-container": "#6063ee",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#a36700",
                        "surface-dim": "#d8dadc",
                        "on-surface": "#191c1e",
                        "on-secondary-fixed-variant": "#404178",
                        "inverse-surface": "#2d3133",
                        "background": "#f7f9fb",
                        "on-secondary-fixed": "#13144a",
                        "error": "#ba1a1a",
                        "secondary": "#575992",
                        "on-primary-fixed": "#07006c",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "primary": "#4648d4",
                        "on-surface-variant": "#464554",
                        "secondary-fixed-dim": "#c0c1ff",
                        "surface-variant": "#e0e3e5",
                        "error-container": "#ffdad6",
                        "surface": "#f7f9fb",
                        "tertiary-fixed-dim": "#ffb95f",
                        "tertiary": "#825100",
                        "inverse-on-surface": "#eff1f3",
                        "surface-container": "#eceef0",
                        "surface-tint": "#494bd6",
                        "inverse-primary": "#c0c1ff",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#653e00",
                        "outline-variant": "#c7c4d7",
                        "secondary-fixed": "#e1e0ff",
                        "primary-fixed-dim": "#c0c1ff",
                        "tertiary-fixed": "#ffddb8",
                        "on-secondary-container": "#494b83"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {},
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col pb-24">
<!-- TopAppBar -->
<header class="bg-[#f7f9fb] text-[#4648d4] font-['Inter'] font-semibold tracking-tight w-full top-0 sticky flex justify-between items-center px-6 py-4 w-full z-40 bg-[#f2f4f6]">
<div class="text-2xl font-bold tracking-tighter text-[#191c1e]">Sayaç Pro</div>
<div class="flex items-center gap-4 text-[#4648d4]">
<button class="hover:opacity-80 transition-opacity scale-95 active:transition-all">
<span class="material-symbols-outlined" data-icon="history">history</span>
</button>
<button class="hover:opacity-80 transition-opacity scale-95 active:transition-all">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col items-center px-4 pt-12 pb-8 w-full max-w-[320px] mx-auto overflow-y-auto">
<!-- Counter Hero -->
<div class="flex flex-col items-center mb-16 relative w-full">
<span class="text-label-sm font-bold tracking-[0.05em] uppercase text-secondary mb-2">Günlük Su</span>
<!-- Pulse Ring (Simulated with div) -->
<div class="absolute inset-0 bg-primary/5 rounded-full blur-3xl -z-10 scale-150"></div>
<h1 class="text-[4rem] font-bold tracking-tighter text-transparent bg-clip-text bg-gradient-to-br from-primary to-primary-container leading-none px-8 py-4">
                4
            </h1>
<span class="text-body-lg text-on-surface-variant mt-2">Bardak</span>
</div>
<!-- Action Controls -->
<div class="flex gap-4 w-full justify-center mb-16">
<button class="w-16 h-16 rounded-xl bg-surface-container-high text-on-surface flex items-center justify-center hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="remove">remove</span>
</button>
<button class="w-24 h-24 rounded-[24px] bg-gradient-to-br from-primary to-primary-container text-on-primary flex items-center justify-center shadow-[0_8px_32px_rgba(70,72,212,0.3)] hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined text-4xl" data-icon="add">add</span>
</button>
<button class="w-16 h-16 rounded-xl bg-transparent text-tertiary flex items-center justify-center border border-outline-variant/15 hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="refresh">refresh</span>
</button>
</div>
<!-- Recent History -->
<div class="w-full">
<div class="flex justify-between items-end mb-6">
<h2 class="text-title-md font-medium text-on-surface">Son Eklenenler</h2>
<span class="text-label-sm font-bold uppercase text-primary tracking-widest">Tümü</span>
</div>
<div class="flex flex-col gap-4">
<!-- List Item 1 -->
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-xl hover:bg-surface-container transition-colors">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed">
<span class="material-symbols-outlined text-xl" data-icon="local_drink">local_drink</span>
</div>
<div class="flex flex-col">
<span class="text-body-lg font-medium text-on-surface">+1 Bardak</span>
<span class="text-label-sm text-on-surface-variant">14:30</span>
</div>
</div>
</div>
<!-- List Item 2 -->
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-xl hover:bg-surface-container transition-colors">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed">
<span class="material-symbols-outlined text-xl" data-icon="local_drink">local_drink</span>
</div>
<div class="flex flex-col">
<span class="text-body-lg font-medium text-on-surface">+1 Bardak</span>
<span class="text-label-sm text-on-surface-variant">11:15</span>
</div>
</div>
</div>
<!-- List Item 3 -->
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-xl hover:bg-surface-container transition-colors">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed">
<span class="material-symbols-outlined text-xl" data-icon="local_drink">local_drink</span>
</div>
<div class="flex flex-col">
<span class="text-body-lg font-medium text-on-surface">+1 Bardak</span>
<span class="text-label-sm text-on-surface-variant">09:00</span>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-6 pb-8 pt-4 md:hidden bg-white/70 backdrop-blur-xl z-50 rounded-t-3xl border border-white/15 shadow-[0_-4px_24px_rgba(70,72,212,0.04)] text-[#4648d4]">
<!-- Tab 1: Sayaç (Active) -->
<button class="flex flex-col items-center justify-center bg-[#4648d4] text-white rounded-2xl p-3 scale-110 -translate-y-2 transition-all">
<span class="material-symbols-outlined" data-icon="add_circle" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-['Inter'] text-[10px] font-bold uppercase tracking-widest mt-1">Sayaç</span>
</button>
<!-- Tab 2: Geçmiş (Inactive) -->
<button class="flex flex-col items-center justify-center text-[#575992] p-2 hover:text-[#4648d4] transition-colors">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-['Inter'] text-[10px] font-bold uppercase tracking-widest mt-1">Geçmiş</span>
</button>
<!-- Tab 3: Ayarlar (Inactive) -->
<button class="flex flex-col items-center justify-center text-[#575992] p-2 hover:text-[#4648d4] transition-colors">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-['Inter'] text-[10px] font-bold uppercase tracking-widest mt-1">Ayarlar</span>
</button>
</nav>
</body></html>
