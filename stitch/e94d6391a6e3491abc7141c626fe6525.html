<!DOCTYPE html>

<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sayaç Pro - Henüz İşlem Yapılmadı</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "primary-fixed": "#e1e0ff",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#191c1e",
                        "surface-bright": "#f7f9fb",
                        "surface-container-low": "#f2f4f6",
                        "outline": "#767586",
                        "on-tertiary-container": "#fffbff",
                        "on-tertiary-fixed": "#2a1700",
                        "surface-container-highest": "#e0e3e5",
                        "on-primary-container": "#fffbff",
                        "secondary-container": "#bdbefe",
                        "surface-container-high": "#e6e8ea",
                        "on-secondary": "#ffffff",
                        "primary-container": "#6063ee",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#a36700",
                        "surface-dim": "#d8dadc",
                        "on-surface": "#191c1e",
                        "on-secondary-fixed-variant": "#404178",
                        "inverse-surface": "#2d3133",
                        "background": "#f7f9fb",
                        "on-secondary-fixed": "#13144a",
                        "error": "#ba1a1a",
                        "secondary": "#575992",
                        "on-primary-fixed": "#07006c",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "primary": "#4648d4",
                        "on-surface-variant": "#464554",
                        "secondary-fixed-dim": "#c0c1ff",
                        "surface-variant": "#e0e3e5",
                        "error-container": "#ffdad6",
                        "surface": "#f7f9fb",
                        "tertiary-fixed-dim": "#ffb95f",
                        "tertiary": "#825100",
                        "inverse-on-surface": "#eff1f3",
                        "surface-container": "#eceef0",
                        "surface-tint": "#494bd6",
                        "inverse-primary": "#c0c1ff",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#653e00",
                        "outline-variant": "#c7c4d7",
                        "secondary-fixed": "#e1e0ff",
                        "primary-fixed-dim": "#c0c1ff",
                        "tertiary-fixed": "#ffddb8",
                        "on-secondary-container": "#494b83"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: theme('colors.surface');
            color: theme('colors.on-surface');
        }
        .bg-primary-gradient {
            background: linear-gradient(135deg, theme('colors.primary'), theme('colors.primary-container'));
        }
        .ghost-border {
            border: 1px solid rgba(199, 196, 215, 0.15); /* outline-variant at 15% */
        }
    </style>
</head>
<body class="flex min-h-screen bg-surface">
<!-- SideNavBar (WEB) -->
<nav class="hidden md:flex flex-col h-screen p-4 space-y-2 bg-[#f2f4f6] dark:bg-slate-800 w-64 border-r-0 font-['Inter'] text-sm font-medium z-10 sticky top-0">
<div class="px-4 py-6">
<h1 class="text-xl font-bold text-[#4648d4]">Sayaç Pro</h1>
<p class="text-xs text-slate-500 mt-1">Minimalist Takip</p>
</div>
<div class="flex-1 space-y-1">
<a class="flex items-center space-x-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-white/50 dark:hover:bg-slate-700/50 transition-colors duration-200 rounded-lg" href="#">
<span class="material-symbols-outlined">home</span>
<span>Ana Sayfa</span>
</a>
<a class="flex items-center space-x-3 px-4 py-3 text-[#4648d4] bg-white dark:bg-slate-700 rounded-lg font-bold transition-colors duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">history</span>
<span>Geçmiş</span>
</a>
<a class="flex items-center space-x-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-white/50 dark:hover:bg-slate-700/50 transition-colors duration-200 rounded-lg" href="#">
<span class="material-symbols-outlined">track_changes</span>
<span>Hedefler</span>
</a>
<a class="flex items-center space-x-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-white/50 dark:hover:bg-slate-700/50 transition-colors duration-200 rounded-lg" href="#">
<span class="material-symbols-outlined">settings</span>
<span>Ayarlar</span>
</a>
</div>
</nav>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col min-h-screen pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="w-full top-0 sticky flex justify-between items-center px-6 py-4 bg-[#f7f9fb] dark:bg-slate-900 z-20">
<div class="text-2xl font-bold tracking-tighter text-[#191c1e] dark:text-white font-['Inter']">
                Sayaç
            </div>
<div class="flex space-x-4 text-[#4648d4] dark:text-[#6366F1]">
<button class="hover:opacity-80 transition-opacity scale-95 active:transition-all p-2">
<span class="material-symbols-outlined">history</span>
</button>
<button class="hover:opacity-80 transition-opacity scale-95 active:transition-all p-2">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<!-- Canvas -->
<main class="flex-1 flex flex-col items-center justify-start pt-12 px-6 max-w-4xl mx-auto w-full gap-16">
<!-- Active Counter (Functional but empty context) -->
<section class="flex flex-col items-center justify-center w-full relative">
<!-- Pulse effect placeholder (invisible until interacted) -->
<div class="absolute inset-0 bg-primary/10 rounded-full scale-0 transition-transform duration-500 ease-out z-0"></div>
<div class="z-10 flex flex-col items-center">
<span class="text-[0.6875rem] font-bold tracking-[0.05em] uppercase text-outline mb-4">Şu Anki Sayım</span>
<h2 class="text-[3.5rem] font-bold tracking-[-0.04em] text-on-surface leading-none mb-8">0</h2>
</div>
<!-- Interaction Core -->
<div class="flex gap-4 z-10">
<button class="w-16 h-16 rounded-xl bg-surface-container-high text-on-surface flex items-center justify-center ghost-border hover:bg-surface-container-highest transition-colors active:scale-95 shadow-[0_4px_24px_rgba(70,72,212,0.04)]">
<span class="material-symbols-outlined text-2xl">remove</span>
</button>
<button class="h-16 px-12 rounded-xl bg-primary-gradient text-on-primary flex items-center justify-center font-semibold text-lg hover:opacity-90 transition-opacity active:scale-95 shadow-[0_8px_32px_rgba(70,72,212,0.2)]">
                        Arttır
                    </button>
</div>
<button class="mt-6 text-tertiary font-medium text-sm hover:opacity-80 transition-opacity z-10 px-4 py-2">
                    Sıfırla
                </button>
</section>
<!-- History Empty State (The Focus) -->
<section class="w-full mt-8 bg-surface-container-low rounded-3xl p-8 flex flex-col items-center justify-center min-h-[300px]">
<div class="bg-surface-container rounded-full p-6 mb-6">
<span class="material-symbols-outlined text-4xl text-outline-variant">history_toggle_off</span>
</div>
<h3 class="text-[1.125rem] font-medium text-on-surface mb-2">Geçmiş Kayıtlar</h3>
<p class="text-base italic text-gray-400 text-center max-w-sm">
                    Henüz işlem yapılmadı
                </p>
</section>
</main>
</div>
<!-- BottomNavBar (MOBILE) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-6 pb-8 pt-4 md:hidden bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl z-50 rounded-t-3xl ghost-border border-white/15 shadow-[0_-4px_24px_rgba(70,72,212,0.04)]">
<a class="flex flex-col items-center justify-center text-[#575992] dark:text-slate-400 p-2 hover:text-[#4648d4] scale-110 duration-300 ease-out font-['Inter'] text-[10px] font-bold uppercase tracking-widest" href="#">
<span class="material-symbols-outlined mb-1">add_circle</span>
<span>Sayaç</span>
</a>
<a class="flex flex-col items-center justify-center bg-[#4648d4] text-white rounded-2xl p-3 scale-110 -translate-y-2 transition-all hover:text-white font-['Inter'] text-[10px] font-bold uppercase tracking-widest" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">history</span>
<span>Geçmiş</span>
</a>
<a class="flex flex-col items-center justify-center text-[#575992] dark:text-slate-400 p-2 hover:text-[#4648d4] scale-110 duration-300 ease-out font-['Inter'] text-[10px] font-bold uppercase tracking-widest" href="#">
<span class="material-symbols-outlined mb-1">settings</span>
<span>Ayarlar</span>
</a>
</nav>
</body></html>
